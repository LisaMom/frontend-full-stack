<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <title>Dark Mode</title>
    <link rel="stylesheet" href="../output.css">
    
    <!-- Inline script in <head> to avoid FOUC -->
    <script>
        const updateTheme = () => {
            const isDark = localStorage.theme === "dark" || (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches);
            
            // 1. Your exact statement for classes
            document.documentElement.classList.toggle("dark", isDark);
            
            // 2. Attribute toggle for DaisyUI / Flowbite
            document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        };
        
        updateTheme();
    </script>
    <!-- 
    document.documentElement.classList.toggle(
  "dark",
  localStorage.theme === "dark" ||
    (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches),
);
// Whenever the user explicitly chooses light mode
localStorage.theme = "light";
// Whenever the user explicitly chooses dark mode
localStorage.theme = "dark";
// Whenever the user explicitly chooses to respect the OS preference
localStorage.removeItem("theme");
 -->
</head>
<body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-white transition-colors duration-300">

    <div class="p-8 max-w-md mx-auto my-10 bg-gray-100 dark:bg-gray-800 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-4">Manual Dark Mode (Data Attribute)</h1>
        <p class="text-gray-600 dark:text-gray-300 mb-6">
            វិធីនេះប្រើប្រាស់ Attribute ជំនួស Class វិញ ដែលពេញនិយមប្រើជាមួយ Library ដូចជា DaisyUI ឬ Flowbite!
        </p> 
        
        <!-- Toggle Button -->
        <button onclick="toggleTheme()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">
            Switch Theme
        </button>
    </div>

    <script>
        function toggleTheme() {
            // Evaluates current state and assigns 'light' or 'dark' directly using a ternary operator
            localStorage.theme = document.documentElement.classList.contains("dark") ? "light" : "dark";
            
            updateTheme();
        }
    </script>
</body>
</html>
