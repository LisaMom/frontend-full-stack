    <main class="container mx-auto px-4 bg-amber-200">
  <h1 class="text-2xl font-bold ">កាតាឡុកម្ហូបអាហារ</h1>
  <p>ខ្លឹមសារទាំងមូលនឹងត្រូវតម្រឹមទំហំទៅតាមទំហំអេក្រង់ (Screen Size)។</p>
</main>

<!-- ========================================== -->
<!-- កន្លែងទី ១៖ ដាក់ក្នុង Sidebar (ប្រអប់តូច w-64) -->
<!-- ========================================== -->
<aside class="@container w-64 border p-4">
  <p class="text-xs text-gray-500 mb-2">ក្នុង Sidebar (ប្រអប់តូច):</p>
  
  <!-- PROFILE CARD -->
  <div class="flex flex-col @[350px]:flex-row items-center gap-4 bg-yellow-800 p-4 rounded-lg">
    <img src="avatar.jpg" class="w-16 h-16 rounded-full" alt="User" />
    <div>
      <h3 class="font-bold text-base">សុក មករា</h3>
      <p class="text-sm text-gray-600">Frontend Developer</p>
    </div>
  </div>
</aside>

<!-- ========================================== -->
<!-- កន្លែងទី ២៖ ដាក់ក្នុង Main Content (ប្រអប់ធំ w-full) -->
<!-- ========================================== -->
<section class="@container w-full border p-4 mt-6">
  <p class="text-xs text-gray-500 mb-2">ក្នុង Main Content (ប្រអប់ធំ):</p>
  
  <!-- PROFILE CARD ដដែល ប្រើ CODE ដូចគ្នាបេះបិទ! -->
  <div class="flex flex-col @[350px]:flex-row items-center gap-4 bg-pink-500 p-4 rounded-lg">
    <img src="avatar.jpg" class="w-16 h-16 rounded-full" alt="User" />
    <div>
      <h3 class="font-bold text-base">សុក មករា</h3>
      <p class="text-sm text-gray-600">Frontend Developer</p>
    </div>
  </div>
</section>
