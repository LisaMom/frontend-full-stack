<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/root.css">
    <style>
.container {
          display: grid;
        
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 2fr;
          grid-gap: 10px;
        }     
        
        .container div {
          border: 3px black;
          border-radius: 7px; 
          background-color: yellowgreen;
          padding: 1em;
          text-align: center;
          color: darkgreen;
          margin: 20px 40px 80px 90px;
          
        }
    </style>
</head>
<body>
  <div class="container">
        <div>box-1</div>
        <div>box-2</div>
        <div>box-1</div>
        <div>box-2</div>
        <div>box-1</div>
        <div>box-2</div>
          <div>box-1</div>
        <div>box-2</div>
          <div>box-1</div>
        <div>box-2</div>
          <div>box-1</div>
        <div>box-2</div>
  </div>
</body>
</html>
