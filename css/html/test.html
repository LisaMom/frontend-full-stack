/* Base style for the link button */
a { 
  background-color: green; 
  color: white; 
  padding: 5px 5px; 
  border-radius: 5px; 
  text-align: center; 
  text-decoration: none; 
  display: inline-block; 
}

/* Corrected hover state rule */
a:hover { 
  background-color: blue; 
  color: white; 
}

.gfg {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 60px;
    color: #090;
    text-align: center;
}
body {
    font-family: "Arial", sans-serif;
}
h1 {
    font-size: 32px;
}

p {
    font-size: 1.2em;
}
p {
    font-weight: bold; /* អក្សរដិត */
}

strong {
    font-weight: 700; /* ស្មើនឹង bold */
}
em {
    font-style: italic; /* អក្សរទ្រេត */
}

p {
    font-style: normal; /* អក្សរធម្មតា */
}
p {
    line-height: 1.5;
}
body {
    font-family: "Verdana", sans-serif;
}
body {
    font-size: 16px;
}

@media (max-width: 600px) {
    body {
        font-size: 14px;

<a href="#">Click Here</a>
<table border="1"> 
    <caption>Student Info</caption> 
    <thead> 
        <tr> <th>Name</th> 
            <th>Age</th> 
            <th>Score</th> 
        </tr> 
        <th colspan="2">Telephone</th>
        <th rowspan="2">Telephone</th>
    </thead> 
    <tbody> 
        <tr> 
            <td>Dara</td> 
            <td>18</td> 
            <td>90</td> 
        </tr> 
    </tbody> 
    <tfoot> 
        <tr> 
            <td>Total</td> 
            <td>-</td> 
            <td>90</td> 
        </tr> 
    </tfoot> 
</table>
