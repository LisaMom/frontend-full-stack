.parent-container {
  position: relative; /* Act as the anchor for the child */
  width: 300px;
  height: 200px;
  background-color: #f0f0f0;
}

.absolute-badge {
  position: absolute; /* Pull out of normal document flow */
  top: 10px;          /* 10px down from the parent's top edge */
  right: 10px;        /* 10px left from the parent's right edge */
  background-color: red;
  color: white;
}


    </style>
