<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        a{
            background-color: blue;
            color: aliceblue;
            border: 50px;
            border-radius: 10px;
            text-align: center;
            padding: 10px;
        }
        a:hover{
            background-color: palegreen;
            color: black;
        }
        a:visited{
            background-color: palevioletred;
            color: yellow;
        }
    </style>
</head>
<body>
    <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/list-style-image">click here</a>
</body>
</html>
