<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts Style</title>
    <link rel="stylesheet" href="">
    <style>
        @font-face {
            font-family: 'myFont';
            src: url('./font/Angkor-Regular.ttf');
        }

        /* Apply the font to the body or specific elements */
        body {
            font-family: 'myFont', sans-serif;
        }

        /* Alternatively, apply it directly to the h1 */
        h1 {
            font-family: 'myFont', sans-serif;
        }
    </style>
    
</head>
<body>
    <h1>សួស្ដីនេះគឺជាការប្រើប្រាស់ពុម្ពអក្សរ</h1>
</body>
</html>
